name: Generate fantacalcio.xlsx
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate fantacalcio.xlsx
        run: |
          python - <<'PY'
          import pandas as pd
          import os

          # Lettura del file lista_30_giocatori.csv se presente
          if os.path.exists('lista_30_giocatori.csv'):
              df30 = pd.read_csv('lista_30_giocatori.csv', dtype=str)
          else:
              df30 = pd.DataFrame(columns=['Nome','Ruolo','Squadra','Prezzo consigliato','Motivazione'])

          # Lettura di rosa_18_giocatori.csv se presente, altrimenti foglio vuoto con intestazioni
          if os.path.exists('rosa_18_giocatori.csv'):
              df18 = pd.read_csv('rosa_18_giocatori.csv', dtype=str)
          else:
              df18 = pd.DataFrame(columns=df30.columns)

          # Scrittura dell'Excel con due sheet
          with pd.ExcelWriter('fantacalcio.xlsx', engine='openpyxl') as writer:
              df30.to_excel(writer, sheet_name='30_giocatori', index=False)
              df18.to_excel(writer, sheet_name='Rosa_18', index=False)
          PY

      - name: Commit and push fantacalcio.xlsx
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fantacalcio.xlsx
          git commit -m "Generate fantacalcio.xlsx" || echo "No changes to commit"
          git push "$REPO_URL" HEAD:${{ github.ref_name }} || echo "Push failed"